# The checks that need neither the results/ stores (not committed) nor Docker.
# .githooks/pre-commit runs these and check_simulator locally.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run python -m harness.check_sealed
      - run: uv run python -m analysis.check_routers
      - run: uv run python -m analysis.check_comparisons
      - run: uv run python -m analysis.check_walk
      - run: uv run python -m analysis.check_folds
      - run: uv run python -m analysis.check_metrics
      - run: uv run python -m analysis.check_rules_router
      - run: uv run python -m analysis.check_chart_routers
      - run: uv run python -m analysis.check_jev_names
      - run: uv run python -m analysis.check_stage5
      - run: uv run python -m analysis.check_trained_router
      - run: uv run python -m analysis.check_trained_freeze
      - run: uv run python -m analysis.check_trained_fit
      - run: uv run python -m analysis.check_learning_curve
      - run: uv run python -m analysis.check_jev_settings
      - run: uv run python -m analysis.check_jev_call
      - run: uv run python -m analysis.check_jev_client
      - run: uv run python -m analysis.check_jev_plus
      - run: uv run python -m analysis.check_jev_collect
      - run: uv run python -m analysis.check_jev_fit
      - run: uv run python -m analysis.check_jev_settings_commit
