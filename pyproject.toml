[project]
name = "api-cost-optimizer"
version = "0.1.0"
description = "Cost-quality routing study for LLM inference (see PLAN_v4.md)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.14.0",
    "datasets>=5.1.0",
    "emoji>=2.16.0",
    "immutabledict>=4.3.1",
    "langdetect>=1.0.9",
    "math-verify[antlr4-13-2]>=0.9.0",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy==2.5.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn==1.9.1", # the fit script only; routers/ never imports it (Amendment A11 item 10)
    "syllapy>=0.8.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "transformers==5.20.2",
]

# Exact pins, so a re-lock for an unrelated reason can't move the trained router's numerics (Amendment A11 item 4).
# On Linux, PyTorch comes from its CPU-only index, so CI doesn't download CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
include = ["*.py"] # not the Python examples inside Markdown, such as the frozen plans
extend-exclude = ["harness/ifeval", "harness/ifbench"] # vendored at pinned commits

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["analysis", "harness", "routers"]
exclude = ["harness/ifeval/", "harness/ifbench/"]
ignore_missing_imports = true
disable_error_code = ["annotation-unchecked"] # a note about untyped functions, not an error

[[tool.mypy.overrides]]
module = ["harness.ifeval.*", "harness.ifbench.*"] # vendored at pinned commits
ignore_errors = true
