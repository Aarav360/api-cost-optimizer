# Pinned model configs and the one shared price snapshot (PLAN_v4.md §6, Amendment A1).
# The plain Claude 5.5 IDs are the pinned versions; there is no dated suffix.
# Log the `model` each response reports and compare it against these IDs.

price_snapshot: "2026-10-12"
batch_discount: 0.5 # Message Batches API price multiplier

# USD per 1M tokens. Thinking tokens are billed as output tokens.
prices:
  claude-haiku-5-5:
    input: 0.10 # prompts <= 100K tokens; $0.50 / $2.50 above that
    output: 0.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
  claude-opus-5-5:
    input: 4.00
    output: 20.00

# Effort is always set explicitly, because Opus 5.5 and Haiku 5.5 default to
# medium while Sonnet 5.5 defaults to high. No temperature (these models reject it)
# and no refusal fallbacks, so every row comes from its own config's model.
#
# max_tokens is the collection run's output cap (Amendment A3): at least 3x the
# longest output each config gave on the four chosen tasks in the pilot (Haiku
# 10,637 on IFEval; Sonnet 4,739, Opus low 3,089, Opus 4,235). The pilot itself
# ran every config at 32,000. Only generated tokens are billed, so headroom is free.
# Haiku's cap is 64,000 (Amendment A4): on hard problems it can think past
# 32,000 tokens, and a cap stop scores as a failure.
configs:
  haiku:
    model: claude-haiku-5-5
    effort: high
    max_tokens: 64000
  sonnet:
    model: claude-sonnet-5-5
    effort: high
    max_tokens: 16000
  opus_low:
    model: claude-opus-5-5
    effort: low
    max_tokens: 16000
  opus:
    model: claude-opus-5-5
    effort: medium
    max_tokens: 16000
